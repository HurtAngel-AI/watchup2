<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch OS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #000; color: #fff; padding: 4px; display: flex; flex-direction: column; align-items: center; }
        
        .card { background: #111; border: 1px solid #222; border-radius: 8px; width: 100%; max-width: 360px; padding: 8px; margin-bottom: 8px; }
        h2 { font-size: 0.85rem; color: #00d2ff; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        input, select, button { background: #222; border: 1px solid #333; color: #fff; padding: 6px; border-radius: 4px; font-size: 0.75rem; outline: none; }
        input { width: 100%; margin-bottom: 6px; }
        button { background: #007aff; border: none; font-weight: bold; cursor: pointer; width: 100%; }

        /* Login Screen */
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .login-box { background: #111; border: 1px solid #222; padding: 14px; border-radius: 8px; width: 100%; max-width: 280px; text-align: center; }

        /* App 1: DM */
        .chat-box { height: 130px; overflow-y: auto; background: #050505; border: 1px solid #222; border-radius: 4px; padding: 6px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 4px; }
        .msg { background: #222; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; max-width: 90%; }
        .msg.me { background: #0055ff; align-self: flex-end; }
        .msg-meta { font-size: 0.55rem; opacity: 0.6; margin-bottom: 2px; }

        /* App 2: ProxWeb (Watch Fit) */
        .browser-bar { display: flex; gap: 4px; margin-bottom: 6px; }
        .browser-bar input { margin-bottom: 0; }
        .browser-bar button { width: auto; padding: 0 10px; }
        iframe { width: 100%; height: 260px; border: 1px solid #222; border-radius: 4px; background: #fff; }

        .admin-bar { display: flex; gap: 4px; margin-top: 4px; }
        .admin-bar button { background: #333; font-size: 0.65rem; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <div class="login-box">
            <h3 style="margin-bottom: 8px; color: #00d2ff; font-size: 0.9rem;">Saat Giriş</h3>
            <input type="text" id="login-username" placeholder="Cihaz Adı">
            <input type="password" id="login-password" placeholder="Şifre (Admin: 456456456)">
            <button onclick="doLogin()">Giriş</button>
        </div>
    </div>

    <!-- MASAÜSTÜ -->
    <div id="app-content" style="display: none; width: 100%; max-width: 360px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.7rem;">
            <span id="user-badge" style="color: #aaa;"></span>
            <span id="role-badge" style="background: #0055ff; padding: 1px 6px; border-radius: 6px;"></span>
        </div>

        <!-- DM -->
        <div class="card">
            <h2>💬 DM <button onclick="loadUsers()" style="width:auto; padding:1px 6px; font-size:0.6rem; background:#333;">Yenile</button></h2>
            <select id="chat-recipient" style="width: 100%; margin-bottom: 6px;"></select>
            <div class="chat-box" id="chat-box"></div>
            <div style="display: flex; gap: 4px;">
                <input type="text" id="chat-input" placeholder="Mesaj..." style="margin-bottom: 0;" onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" style="width: 50px;">At</button>
            </div>
        </div>

        <!-- PROXWEB -->
        <div class="card">
            <h2>🌐 ProxWeb</h2>
            <div class="browser-bar">
                <input type="text" id="proxy-url" placeholder="m.instagram.com" onkeypress="if(event.key==='Enter') loadProxy()">
                <button onclick="loadProxy()">Git</button>
            </div>
            <iframe id="proxy-frame" src="about:blank"></iframe>
        </div>

        <!-- ADMIN -->
        <div id="admin-panel" class="card" style="display: none; border-color: #ff9500;">
            <h2 style="color: #ff9500;">⚙️ Admin</h2>
            <div class="admin-bar">
                <button onclick="exportJSON()">JSON İndir</button>
                <button onclick="document.getElementById('import-file').click()">JSON Yükle</button>
                <input type="file" id="import-file" style="display: none;" onchange="importJSON(this)">
            </div>
        </div>

    </div>

    <script>
        let currentUser = "";
        let currentRole = "";

        async function doLogin() {
            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value.trim();

            if (!username) return alert("İsim girin.");

            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (data.success) {
                currentUser = data.username;
                currentRole = data.role;

                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-content").style.display = "block";
                document.getElementById("user-badge").innerText = "👤 " + currentUser;
                document.getElementById("role-badge").innerText = currentRole.toUpperCase();

                if (currentRole === "admin") {
                    document.getElementById("admin-panel").style.display = "block";
                }

                loadUsers();
                loadMessages();
                setInterval(loadMessages, 3000);
            } else {
                alert("Giriş hatası.");
            }
        }

        async function loadUsers() {
            const res = await fetch("/api/users");
            const users = await res.json();
            const select = document.getElementById("chat-recipient");
            const currentVal = select.value;
            
            select.innerHTML = '<option value="ALL">Herkes (Genel)</option>';
            users.forEach(u => {
                if (u !== currentUser) {
                    const opt = document.createElement("option");
                    opt.value = u;
                    opt.innerText = u;
                    select.appendChild(opt);
                }
            });
            select.value = currentVal;
        }

        async function loadMessages() {
            if (!currentUser) return;
            const res = await fetch(`/api/messages?username=${encodeURIComponent(currentUser)}`);
            const msgs = await res.json();
            const box = document.getElementById("chat-box");
            
            box.innerHTML = "";
            msgs.forEach(m => {
                const div = document.createElement("div");
                div.className = "msg" + (m.from === currentUser ? " me" : "");
                div.innerHTML = `<div class="msg-meta">${m.from} ➔ ${m.to} (${m.time})</div><div>${escapeHtml(m.text)}</div>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const recipient = document.getElementById("chat-recipient").value;
            const input = document.getElementById("chat-input");
            const text = input.value.trim();

            if (!text) return;

            const res = await fetch("/api/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ from: currentUser, to: recipient, text })
            });

            if ((await res.json()).success) {
                input.value = "";
                loadMessages();
            }
        }

        function loadProxy() {
            let url = document.getElementById("proxy-url").value.trim();
            if (url) {
                document.getElementById("proxy-frame").src = `/proxy?url=${encodeURIComponent(url)}`;
            }
        }

        function exportJSON() {
            window.location.href = "/api/admin/export";
        }

        async function importJSON(input) {
            if (!input.files.length) return;
            const formData = new FormData();
            formData.append("file", input.files[0]);

            const res = await fetch("/api/admin/import", {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            alert(data.message || data.error);
            if (data.success) {
                loadUsers();
                loadMessages();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
