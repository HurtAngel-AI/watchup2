<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web OS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f0f12; color: #fff; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .card { background: #1a1a24; border: 1px solid #2d2d3f; border-radius: 12px; width: 100%; max-width: 500px; padding: 12px; margin-bottom: 12px; }
        h2 { font-size: 1rem; color: #00d2ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        input, select, button { background: #252538; border: 1px solid #3d3d5c; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; }
        input { width: 100%; margin-bottom: 8px; }
        button { background: #007aff; border: none; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { opacity: 0.9; }

        /* Login Screen */
        #login-screen { position: fixed; inset: 0; background: #0f0f12; z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: #1a1a24; border: 1px solid #2d2d3f; padding: 20px; border-radius: 12px; width: 100%; max-width: 320px; text-align: center; }

        /* App 1: DM */
        .chat-header { display: flex; gap: 8px; margin-bottom: 8px; }
        .chat-box { height: 160px; overflow-y: auto; background: #0f0f12; border: 1px solid #252538; border-radius: 6px; padding: 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
        .msg { background: #252538; padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; max-width: 85%; }
        .msg.me { background: #0055ff; align-self: flex-end; }
        .msg-meta { font-size: 0.65rem; opacity: 0.6; margin-bottom: 2px; }

        /* App 2: ProxWeb */
        .browser-bar { display: flex; gap: 6px; margin-bottom: 8px; }
        .browser-bar input { margin-bottom: 0; }
        .browser-bar button { width: auto; padding: 0 16px; }
        iframe { width: 100%; height: 320px; border: 1px solid #2d2d3f; border-radius: 6px; background: #fff; }

        /* Admin Controls */
        .admin-bar { display: flex; gap: 6px; margin-top: 6px; }
        .admin-bar button { background: #333; font-size: 0.75rem; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <div class="login-box">
            <h3 style="margin-bottom: 12px; color: #00d2ff;">Web OS Giriş</h3>
            <input type="text" id="login-username" placeholder="Cihaz / Kullanıcı Adı">
            <input type="password" id="login-password" placeholder="Şifre (Admin için: 456456456)">
            <button onclick="doLogin()">Giriş Yap</button>
        </div>
    </div>

    <!-- MASAÜSTÜ / UYGULAMALAR -->
    <div id="app-content" style="display: none; width: 100%; max-width: 500px;">
        
        <!-- ÜST BİLGİ -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span id="user-badge" style="font-size: 0.8rem; color: #aaa;"></span>
            <span id="role-badge" style="font-size: 0.7rem; background: #0055ff; padding: 2px 8px; border-radius: 10px;"></span>
        </div>

        <!-- UYGULAMA 1: DM SOHBET -->
        <div class="card">
            <h2>💬 DM Mesajlaşma <button onclick="loadUsers()" style="width:auto; padding:2px 8px; font-size:0.7rem; background:#333;">Yenile</button></h2>
            <div class="chat-header">
                <select id="chat-recipient" style="width: 100%;">
                    <option value="ALL">Herkes (Genel)</option>
                </select>
            </div>
            <div class="chat-box" id="chat-box"></div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="chat-input" placeholder="Mesaj yazın..." style="margin-bottom: 0;" onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" style="width: 70px;">Gönder</button>
            </div>
        </div>

        <!-- UYGULAMA 2: PROXWEB -->
        <div class="card">
            <h2>🌐 ProxWeb (Sanal Tarayıcı)</h2>
            <div class="browser-bar">
                <input type="text" id="proxy-url" placeholder="google.com veya URL girin..." onkeypress="if(event.key==='Enter') loadProxy()">
                <button onclick="loadProxy()">Git</button>
            </div>
            <iframe id="proxy-frame" src="about:blank"></iframe>
        </div>

        <!-- ADMIN PANELİ (SADECE ADMİNE GÖRÜNÜR) -->
        <div id="admin-panel" class="card" style="display: none; border-color: #ff9500;">
            <h2 style="color: #ff9500;">⚙️ Super Admin Paneli</h2>
            <div class="admin-bar">
                <button onclick="exportJSON()">RAM JSON İndir</button>
                <button onclick="document.getElementById('import-file').click()">RAM JSON Yükle</button>
                <input type="file" id="import-file" style="display: none;" onchange="importJSON(this)">
            </div>
        </div>

    </div>

    <script>
        let currentUser = "";
        let currentRole = "";

        async function doLogin() {
            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value.trim();

            if (!username) {
                alert("Lütfen kullanıcı adı girin.");
                return;
            }

            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (data.success) {
                currentUser = data.username;
                currentRole = data.role;

                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-content").style.display = "block";
                document.getElementById("user-badge").innerText = "👤 " + currentUser;
                document.getElementById("role-badge").innerText = currentRole.toUpperCase();

                if (currentRole === "admin") {
                    document.getElementById("admin-panel").style.display = "block";
                }

                loadUsers();
                loadMessages();
                setInterval(loadMessages, 3000);
            } else {
                alert(data.error || "Giriş başarısız.");
            }
        }

        async function loadUsers() {
            const res = await fetch("/api/users");
            const users = await res.json();
            const select = document.getElementById("chat-recipient");
            
            const currentVal = select.value;
            select.innerHTML = '<option value="ALL">Herkes (Genel)</option>';
            
            users.forEach(u => {
                if (u !== currentUser) {
                    const opt = document.createElement("option");
                    opt.value = u;
                    opt.innerText = u;
                    select.appendChild(opt);
                }
            });
            select.value = currentVal;
        }

        async function loadMessages() {
            if (!currentUser) return;
            const res = await fetch(`/api/messages?username=${encodeURIComponent(currentUser)}`);
            const msgs = await res.json();
            const box = document.getElementById("chat-box");
            
            box.innerHTML = "";
            msgs.forEach(m => {
                const div = document.createElement("div");
                div.className = "msg" + (m.from === currentUser ? " me" : "");
                div.innerHTML = `<div class="msg-meta">${m.from} ➔ ${m.to} (${m.time})</div><div>${escapeHtml(m.text)}</div>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const recipient = document.getElementById("chat-recipient").value;
            const input = document.getElementById("chat-input");
            const text = input.value.trim();

            if (!text) return;

            const res = await fetch("/api/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ from: currentUser, to: recipient, text })
            });

            if ((await res.json()).success) {
                input.value = "";
                loadMessages();
            }
        }

        function loadProxy() {
            const url = document.getElementById("proxy-url").value.trim();
            if (url) {
                document.getElementById("proxy-frame").src = `/proxy?url=${encodeURIComponent(url)}`;
            }
        }

        function exportJSON() {
            window.location.href = "/api/admin/export";
        }

        async function importJSON(input) {
            if (!input.files.length) return;
            const formData = new FormData();
            formData.append("file", input.files[0]);

            const res = await fetch("/api/admin/import", {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            alert(data.message || data.error);
            if (data.success) {
                loadUsers();
                loadMessages();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
